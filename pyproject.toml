[project]
name = "visual-search"
version = "0.1.0"
description = "Visual search with fine-tuned embeddings"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pillow",
    "torch",
    "torchvision",
    "transformers",
    "peft",
    "faiss-cpu",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "httpx"]
# ONNX export and the API. ONNX Runtime here is the CPU build.
serve = ["onnx", "onnxscript", "onnxruntime", "fastapi", "uvicorn", "python-multipart"]
# Only the detector step needs this. Ultralytics is AGPL-licensed, so it stays out of the core install.
detect = ["ultralytics"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
