[project]
name = "visual-search"
version = "0.1.0"
description = "Visual search with fine-tuned embeddings"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pillow",
    "torch",
    "transformers",
    "faiss-cpu",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
